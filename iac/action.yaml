name: 'CICD IaC Scanner'
description: 'Infrastructure as Code security scanning with Checkov'
author: 'LauraWangQiu'

branding:
  icon: 'server'
  color: 'blue'

inputs:
  framework:
    description: 'Frameworks to scan (all, terraform, kubernetes, dockerfile, etc.)'
    required: false
    default: 'all'
  fail_on_findings:
    description: 'Fail the workflow if misconfigurations are found'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Build IaC scanner image
      shell: bash
      run: docker build -t cicd-iac-scanner ${{ github.action_path }}

    - name: Run IaC scanning
      shell: bash
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/scan \
          -e FRAMEWORK=${{ inputs.framework }} \
          cicd-iac-scanner

    - name: Check for findings in results
      id: check_findings
      shell: bash
      run: |
        if [ -f results.sarif ]; then
          COUNT=$(jq '.runs[0].results | length' results.sarif 2>/dev/null || echo "0")
          if [ "$COUNT" -gt 0 ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          fi
        fi
        echo "found=false" >> $GITHUB_OUTPUT

    - name: Upload SARIF artifact
      if: steps.check_findings.outputs.found == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: iac-results-${{ github.sha }}
        path: results.sarif

    - name: Upload SARIF to GitHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif
      continue-on-error: true

    - name: Fail if misconfigurations detected
      if: inputs.fail_on_findings == 'true' && steps.check_findings.outputs.found == 'true'
      shell: bash
      run: |
        echo "❌ IaC scan found ${{ steps.check_findings.outputs.count }} misconfigurations"
        exit 1
