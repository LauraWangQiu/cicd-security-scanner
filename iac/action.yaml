name: 'CICD IaC Scanner'
description: 'Infrastructure as Code security scanning (supports Checkov, Trivy, and custom tools)'
author: 'LauraWangQiu'

branding:
  icon: 'server'
  color: 'blue'

inputs:
  tool:
    description: 'Scanning tool to use: checkov, trivy'
    required: false
    default: 'checkov'
  framework:
    description: 'Frameworks to scan (all, terraform, kubernetes, dockerfile, etc.)'
    required: false
    default: 'all'
  scan_mode:
    description: 'Scan mode: full (entire repo) or pr (only changed IaC files in PR)'
    required: false
    default: 'full'
  base_ref:
    description: 'Base branch for PR diff comparison (only used when scan_mode=pr)'
    required: false
    default: 'main'
  fail_on_findings:
    description: 'Fail the workflow if misconfigurations are found'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Build IaC scanner image
      shell: bash
      run: docker build -t cicd-iac-scanner ${{ github.action_path }}

    - name: Run IaC scanning
      shell: bash
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/scan \
          -e TOOL=${{ inputs.tool }} \
          -e FRAMEWORK=${{ inputs.framework }} \
          -e SCAN_MODE=${{ inputs.scan_mode }} \
          -e GITHUB_BASE_REF=${{ inputs.base_ref }} \
          cicd-iac-scanner

    - name: Check for findings in results
      id: check_findings
      shell: bash
      run: |
        if [ -f results.sarif ]; then
          COUNT=$(jq '.runs[0].results | length' results.sarif 2>/dev/null || echo "0")
          if [ "$COUNT" -gt 0 ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "found=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload SARIF artifact
      if: steps.check_findings.outputs.found == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: iac-results-${{ github.sha }}
        path: results.sarif

    - name: Comment findings on PR
      if: steps.check_findings.outputs.found == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const script = require('${{ github.action_path }}/scripts/comment-findings.js');
          await script({ github, context });

    - name: Upload SARIF to GitHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: results.sarif
      continue-on-error: true

    - name: Fail if misconfigurations detected
      if: inputs.fail_on_findings == 'true' && steps.check_findings.outputs.found == 'true'
      shell: bash
      run: |
        echo "::error::Found ${{ steps.check_findings.outputs.count }} misconfiguration(s) in infrastructure code"
        exit 1
