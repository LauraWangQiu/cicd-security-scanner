name: 'CICD Container Scanner'
description: 'Container image vulnerability scanning (supports Trivy, Grype, and custom tools)'
author: 'LauraWangQiu'

branding:
  icon: 'box'
  color: 'green'

inputs:
  tool:
    description: 'Scanning tool to use: trivy, grype'
    required: false
    default: 'trivy'
  image:
    description: 'Container image to scan (e.g., nginx:latest, myapp:v1.0)'
    required: false
    default: ''
  severity:
    description: 'Minimum severity to report (CRITICAL, HIGH, MEDIUM, LOW)'
    required: false
    default: 'HIGH,CRITICAL'
  scan_mode:
    description: 'Scan mode: full (entire repo) or pr (only changed Dockerfiles in PR)'
    required: false
    default: 'full'
  base_ref:
    description: 'Base branch for PR diff comparison (only used when scan_mode=pr)'
    required: false
    default: 'main'
  fail_on_vulnerabilities:
    description: 'Fail the workflow if vulnerabilities are found'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Build container scanner image
      shell: bash
      run: docker build -t cicd-container-scanner ${{ github.action_path }}

    - name: Run container scanning
      shell: bash
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/scan \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -e TOOL=${{ inputs.tool }} \
          -e IMAGE=${{ inputs.image }} \
          -e SEVERITY=${{ inputs.severity }} \
          -e SCAN_MODE=${{ inputs.scan_mode }} \
          -e GITHUB_BASE_REF=${{ inputs.base_ref }} \
          cicd-container-scanner

    - name: Check for vulnerabilities
      id: check_vulns
      shell: bash
      run: |
        if [ -f results.sarif ]; then
          COUNT=$(jq '.runs[0].results | length' results.sarif 2>/dev/null || echo "0")
          if [ "$COUNT" -gt 0 ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "found=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload SARIF artifact
      if: steps.check_vulns.outputs.found == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: container-results-${{ github.sha }}
        path: results.sarif

    - name: Comment findings on PR
      if: steps.check_vulns.outputs.found == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const script = require('${{ github.action_path }}/scripts/comment-findings.js');
          await script({ github, context });

    - name: Upload SARIF to GitHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: results.sarif
      continue-on-error: true

    - name: Fail if vulnerabilities detected
      if: inputs.fail_on_vulnerabilities == 'true' && steps.check_vulns.outputs.found == 'true'
      shell: bash
      run: |
        echo "::error::Found ${{ steps.check_vulns.outputs.count }} vulnerability(ies) in container/Dockerfile"
        exit 1
