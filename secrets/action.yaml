name: 'CICD Security Scanner'
description: 'Secret scanning with Gitleaks for PR diffs'
author: 'LauraWangQiu'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  base_ref:
    description: 'Base branch reference'
    required: false
    default: 'main'
  scan_mode:
    description: 'Scan mode: pr (changed files), history (git commits), files (current files)'
    required: false
    default: 'auto'

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Build scanner image
      shell: bash
      run: docker build -t cicd-secret-scanner ${{ github.action_path }}

    - name: Run secret scanning
      shell: bash
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/scan \
          -e GITHUB_BASE_REF=${{ inputs.base_ref }} \
          -e SCAN_MODE=${{ inputs.scan_mode }} \
          cicd-secret-scanner

    - name: Check for secrets in results
      id: check_secrets
      shell: bash
      run: |
        chmod +x ${{ github.action_path }}/scripts/check-secrets.sh
        ${{ github.action_path }}/scripts/check-secrets.sh results.sarif >> $GITHUB_OUTPUT

    - name: Upload SARIF artifact
      if: steps.check_secrets.outputs.found == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: secrets-${{ inputs.scan_mode }}-results-${{ github.sha }}
        path: results.sarif

    - name: Upload SARIF to GitHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: results.sarif
      continue-on-error: true

    - name: Comment secrets inline on PR
      if: steps.check_secrets.outputs.found == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const script = require('${{ github.action_path }}/scripts/comment-secrets.js');
          await script({ github, context });

    - name: Fail if secrets found
      if: steps.check_secrets.outputs.found == 'true'
      shell: bash
      run: |
        echo "::error::Found ${{ steps.check_secrets.outputs.count }} secret(s) in the codebase"
        exit 1