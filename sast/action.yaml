name: 'CICD SAST Scanner'
description: 'Static Application Security Testing (supports Semgrep, Bandit, and custom tools)'
author: 'LauraWangQiu'

branding:
  icon: 'code'
  color: 'purple'

inputs:
  tool:
    description: 'Scanning tool to use: semgrep, bandit'
    required: false
    default: 'semgrep'
  config:
    description: 'Semgrep config (auto, p/ci, p/security-audit, etc.) — only used with semgrep'
    required: false
    default: 'auto'
  severity:
    description: 'Minimum severity to report. Semgrep: ERROR,WARNING. Bandit: LOW, MEDIUM, HIGH'
    required: false
    default: 'MEDIUM'
  scan_mode:
    description: 'Scan mode: full (entire repo) or pr (only changed files in PR)'
    required: false
    default: 'full'
  base_ref:
    description: 'Base branch for PR diff comparison (only used when scan_mode=pr)'
    required: false
    default: 'main'
  fail_on_findings:
    description: 'Fail the workflow if findings are found'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Build SAST scanner image
      shell: bash
      run: docker build --build-arg MODULE=sast -t cicd-sast-scanner ${{ github.action_path }}/..

    - name: Run SAST scanning
      shell: bash
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/scan \
          -e TOOL=${{ inputs.tool }} \
          -e SEMGREP_CONFIG=${{ inputs.config }} \
          -e SEVERITY=${{ inputs.severity }} \
          -e SCAN_MODE=${{ inputs.scan_mode }} \
          -e GITHUB_BASE_REF=${{ inputs.base_ref }} \
          cicd-sast-scanner

    - name: Check for findings
      id: check_results
      shell: bash
      run: |
        chmod +x ${{ github.action_path }}/../shared/check-results.sh
        ${{ github.action_path }}/../shared/check-results.sh results.sarif >> $GITHUB_OUTPUT

    - name: Upload SARIF artifact
      if: steps.check_results.outputs.found == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: sast-results-${{ github.sha }}
        path: results.sarif

    - name: Comment findings on PR
      if: steps.check_results.outputs.found == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const script = require('${{ github.action_path }}/scripts/comment-findings.js');
          await script({ github, context });

    - name: Upload SARIF to GitHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: results.sarif
      continue-on-error: true

    - name: Fail if findings detected
      if: inputs.fail_on_findings == 'true' && steps.check_results.outputs.found == 'true'
      shell: bash
      run: |
        echo "::error::Found ${{ steps.check_results.outputs.count }} security issue(s) in source code"
        exit 1
